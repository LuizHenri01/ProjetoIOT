<dialog class="delete-dialog" id="dialog-exclusao" aria-labelledby="titulo-dialog-exclusao" aria-describedby="mensagem-dialog-exclusao">
  <div class="delete-dialog-panel">
    <span class="delete-dialog-icon" aria-hidden="true"><i class="bi bi-trash3"></i></span>
    <p class="lesson-eyebrow">Confirmar exclusão</p>
    <h2 id="titulo-dialog-exclusao">Excluir registro?</h2>
    <p id="mensagem-dialog-exclusao" class="delete-dialog-message"></p>
    <p id="erro-dialog-exclusao" class="delete-dialog-error" role="alert" hidden></p>
    <div class="delete-dialog-actions">
      <button type="button" class="delete-cancel-button" id="cancelar-exclusao">Cancelar</button>
      <button type="button" class="delete-confirm-button" id="confirmar-exclusao"><i class="bi bi-trash3" aria-hidden="true"></i> Excluir</button>
    </div>
  </div>
</dialog>
