<aside class="quick-access-widget" data-open="false" aria-label="Acessibilidade rápida">
    <div id="quick-access-panel" class="quick-access-panel" role="group" aria-labelledby="quick-access-title" hidden>
        <span id="quick-access-title" class="quick-access-title">Texto</span>
        <button id="quick-text-increase" type="button" class="quick-text-button" aria-label="Aumentar texto">
            <i class="bi bi-plus-lg" aria-hidden="true"></i>
        </button>
        <output id="quick-text-value" class="quick-text-value" aria-live="polite">100%</output>
        <button id="quick-text-decrease" type="button" class="quick-text-button" aria-label="Diminuir texto">
            <i class="bi bi-dash-lg" aria-hidden="true"></i>
        </button>
        <button id="quick-text-reset" type="button" class="quick-text-button quick-text-reset" aria-label="Restaurar tamanho padrão do texto" title="Restaurar para 100%">
            <i class="bi bi-arrow-counterclockwise" aria-hidden="true"></i>
        </button>
    </div>
    <button id="quick-access-toggle" type="button" class="quick-access-toggle" aria-expanded="false" aria-controls="quick-access-panel" aria-label="Abrir acessibilidade rápida" title="Acessibilidade">
        <i class="bi bi-universal-access" aria-hidden="true"></i>
    </button>
</aside>
