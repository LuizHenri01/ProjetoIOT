<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Apoio em Sala de Aula</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <h1>Sistema de Apoio em Sala de Aula</h1>
    </header>

    <main>
        <p id="status-conexao" role="status" aria-live="polite">
            Verificando conexão com o servidor...
        </p>

        <section aria-label="Captura de foto do quadro">

            <label for="input-foto" class="botao-grande">
                Tirar foto do quadro
            </label>
            <input
                type="file"
                id="input-foto"
                accept="image/*"
                capture="environment"
                class="input-oculto"
            >
        </section>

        <p id="status-foto" role="status" aria-live="polite"></p>
    </main>

    <script src="{{ url_for('static', filename='js/conexao.js') }}"></script>
    <script src="{{ url_for('static', filename='js/fotos.js') }}"></script>
</body>
</html>
